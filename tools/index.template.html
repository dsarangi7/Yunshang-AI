<!-- ============ FLAGSHIP: eye portal (Act 1) + glasses reveal (Act 2) ============ -->

    <div class="portal-sticky">
      <canvas id="iris" class="iris-canvas" aria-hidden="true"></canvas>

        <p class="intro-brand">YUNSHANG AI</p>
        <p class="intro-line" data-i18n="hero.intro"></p>
        <p class="scroll-hint"><span data-i18n="hero.scroll"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </p>
      </div>
      <div class="stage" id="stage">
        <div class="stage-copy" id="stage-copy">
          <h1 id="hero-title">
            <span class="eyebrow" data-i18n="hero.eyebrow"></span>
            <span class="headline" data-i18n="hero.title"></span>
          </h1>
          <p class="stage-sub" data-i18n="hero.sub"></p>
          <div class="cta-row">
            <a class="btn btn-primary" href="#quote" data-i18n="hero.cta"></a>
            <a class="btn btn-ghost" href="#collection" data-i18n="hero.explore"></a>
          </div>
        </div>
        <div class="stage-product" id="stage-product" role="img" aria-label="@@a11y.stage@@" data-i18n-attr="aria-label:a11y.stage">
          <div class="rim-glow" aria-hidden="true"></div>
          <div class="tilt" id="tilt">
            <div class="spin" id="spin">
              <img class="ys-img" src="assets/g2pro-hero.png" width="1400" height="1072" loading="eager" fetchpriority="high" decoding="async" alt="@@flag.alt.hero@@" data-i18n-attr="alt:flag.alt.hero">
            </div>
          </div>
          <div class="floor" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Act 3: scroll-driven exploded view of the camera lens -->
  <div class="optics" id="optics">
    <div class="optics-sticky">
      <p class="optics-big" id="optics-big" aria-hidden="true" data-i18n="optics.big"></p>
      <div class="optics-inner">
        <div class="optics-copy" id="optics-copy">

            <li><strong data-i18n="optics.stats.1.v"></strong><span data-i18n="optics.stats.1.l"></span></li>
            <li><strong data-i18n="optics.stats.2.v"></strong><span data-i18n="optics.stats.2.l"></span></li>
          </ul>
          <p class="optics-note" data-i18n="optics.note"></p>
        </div>
        <div class="optics-visual" id="optics-visual" role="img" aria-label="@@optics.alt@@" data-i18n-attr="aria-label:optics.alt">
          <div class="optics-glow" id="optics-glow" aria-hidden="true"></div>
          <img class="ys-img optics-glasses" id="optics-glasses" src="assets/g2pro-hero.png" width="1400" height="1072" loading="lazy" decoding="async" alt="">
          <div class="lx-rig" id="lx-rig" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container flagship-body" id="flagship-body" tabindex="-1">
    <header class="section-head reveal">
      <p class="kicker" data-i18n="flag.kicker"></p>
      <h2 data-i18n="flag.title"></h2>
      <p class="lead" data-i18n="flag.lead"></p>
    </header>
    <div class="feature-grid">
@@FEATURES@@
    </div>

    <div class="gallery-wrap">
      <header class="section-head small reveal">
        <h3 data-i18n="flag.galTitle"></h3>
        <p class="lead" data-i18n="flag.galLead"></p>
      </header>
      <div class="gallery">
@@GALLERY@@
      </div>
      <figure class="lens-demo reveal">
        <div class="lens-stage" aria-hidden="false">
          <img class="ys-img lens-photo" src="assets/g2pro-photo.png" width="903" height="904" loading="lazy" decoding="async" alt="@@flag.alt.photo@@" data-i18n-attr="alt:flag.alt.photo">

          <div class="lens-meter" aria-hidden="true">
            <span data-i18n="flag.lens.indoor"></span>
            <i><b></b></i>
            <span data-i18n="flag.lens.outdoor"></span>
          </div>
        </div>
        <figcaption>
          <strong data-i18n="flag.lens.title"></strong>
          <span data-i18n="flag.lens.caption"></span>
        </figcaption>

      <header class="section-head small reveal real-head">

        <p class="lead" data-i18n="flag.real.lead"></p>
      </header>

@@REAL@@

<!-- ============ QUOTE ============ -->
<section id="quote" class="section section-quote" aria-labelledby="quote-title" data-meta="quote">
  <div class="container quote-grid">
    <div class="quote-copy reveal">
      <p class="kicker" data-i18n="quote.kicker"></p>
      <h2 id="quote-title" data-i18n="quote.title"></h2>
      <p class="lead" data-i18n="quote.lead"></p>
      <p class="reply-badge"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="quote.reply"></span></p>
      <p class="muted small" data-i18n="quote.privacy"></p>
    </div>
    <div class="quote-card glass reveal">
      <form id="quote-form" novalidate>
        <div class="field">
          <label for="f-name"><span data-i18n="quote.name"></span> <abbr title="@@quote.required@@" data-i18n-attr="title:quote.required">*</abbr></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name">
          <p class="err" id="e-name" data-err="name" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="f-contact"><span data-i18n="quote.contact"></span> <abbr title="@@quote.required@@" data-i18n-attr="title:quote.required">*</abbr></label>
          <input id="f-contact" name="contact" type="text" autocomplete="email" inputmode="email" required aria-describedby="h-contact e-contact">
          <p class="hint" id="h-contact" data-i18n="quote.contactHint"></p>
          <p class="err" id="e-contact" data-err="contact" aria-live="polite"></p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-country"><span data-i18n="quote.country"></span> <abbr title="@@quote.required@@" data-i18n-attr="title:quote.required">*</abbr></label>
            <input id="f-country" name="country" type="text" autocomplete="country-name" required aria-describedby="e-country">
            <p class="err" id="e-country" data-err="country" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-qty"><span data-i18n="quote.qty"></span> <abbr title="@@quote.required@@" data-i18n-attr="title:quote.required">*</abbr></label>
            <input id="f-qty" name="qty" type="number" min="1" step="1" inputmode="numeric" required aria-describedby="e-qty">
            <p class="err" id="e-qty" data-err="qty" aria-live="polite"></p>
          </div>
        </div>
        <fieldset class="field" aria-describedby="e-products">
          <legend><span data-i18n="quote.products"></span> <abbr title="@@quote.required@@" data-i18n-attr="title:quote.required">*</abbr></legend>
          <div class="check-grid">
@@CHECKS@@
          </div>
          <p class="err" id="e-products" data-err="products" aria-live="polite"></p>
        </fieldset>
        <div class="field">
          <label for="f-msg" data-i18n="quote.msg"></label>
          <textarea id="f-msg" name="message" rows="4" placeholder="@@quote.msgHint@@" data-i18n-attr="placeholder:quote.msgHint"></textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="quote.submit"></button>
      </form>
      <div class="form-success" id="form-success" hidden tabindex="-1">
        <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="#7BD8FF" stroke-width="2"/><path d="M15 24.5l6 6 12-13" fill="none" stroke="#F5B942" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3 data-i18n="quote.okTitle"></h3>
        <p data-i18n="quote.okBody"></p>
        <div class="cta-row">
          <a class="btn btn-primary" id="mailto-link" href="mailto:Szyskj22@163.com" data-i18n="quote.mailto"></a>
          <a class="btn btn-ghost" id="wa-link" href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" rel="noopener" data-i18n="quote.whatsapp"></a>
        </div>
        <button type="button" class="link-btn" id="form-again" data-i18n="quote.again"></button>
      </div>
    </div>
  </div>
</section>
