name: Content or translation
description: A wording, claim, or translation change
labels: [content]
body:
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [English, 中文, Español, हिन्दी, All languages]
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      placeholder: Current text, suggested text, and why.
    validations:
      required: true
