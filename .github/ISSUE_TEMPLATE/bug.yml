name: Bug report
description: Something is wrong on the site
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What did you see, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [English, 中文, Español, हिन्दी, Not sure]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
  - type: input
    id: browser
    attributes:
      label: Browser and device
