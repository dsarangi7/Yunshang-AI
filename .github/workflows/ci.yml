name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: i18n and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check translation dictionary
        run: python3 tools/i18n_check.py translations.js
      - name: Check JavaScript syntax
        run: node --check main.js && node --check translations.js
